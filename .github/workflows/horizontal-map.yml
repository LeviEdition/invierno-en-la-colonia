name: Mapa horizontal — ambientación y acciones
on:
  pull_request:
    branches: [experiment/h3-4-4-ataque-barricadas-mapa]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  horizontal:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run check:build && npm test && npm run test:poc
      - name: Chromium externo al producto
        run: |
          npm install --no-save --package-lock=false playwright@1.57.0
          npx playwright install --with-deps chromium ffmpeg
      - name: Referencia y escenario horizontal
        shell: bash
        run: |
          set -euo pipefail
          node scripts/serve-horizontal-map.mjs --qa > /tmp/horizontal-server.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID"' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8779/prototypes/horizontal-map/ -o /dev/null && break; sleep 1; done
          export CHROMIUM_PATH="$(node --input-type=module -e "import {chromium} from 'playwright';console.log(chromium.executablePath())")"
          git rev-parse HEAD
          npm run check:horizontal-map-build
          npm run check:action-map-build
          npm run check:search-map-build
          npm run check:movement-map-build
          npm run check:state-map-build
          npm run check:workshop-build
          npm run check:hospital-build
          export H344_ORIGIN=http://127.0.0.1:8779
          node scripts/check-h344-browser.mjs
          node scripts/check-h344-edge-browser.mjs
          node scripts/check-h344-movement-browser.mjs
          node scripts/check-h344-camera-browser.mjs
          export H344_MODULE_PATH=/dist/horizontal-map-qa/map.mjs
          export H344_VIEWPORTS=1365x768,852x393,740x360
          export H344_OUTPUT_DIR=/tmp/horizontal-actions
          export H344_EDGE_DIR=/tmp/horizontal-edge
          export H344_MOVEMENT_DIR=/tmp/horizontal-experience
          export H344_CAMERA_DIR=/tmp/horizontal-camera
          node scripts/check-h344-browser.mjs
          node scripts/check-h344-edge-browser.mjs
          node scripts/check-h344-movement-browser.mjs
          node scripts/check-h344-camera-browser.mjs
          node scripts/check-horizontal-map-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: horizontal-map-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            /tmp/horizontal-*/
            /tmp/horizontal-server.log
            /tmp/h344-browser/
            /tmp/h344-edge/
            /tmp/h344-experience/
            /tmp/h344-camera/
            /tmp/d1d2-regressions/
            dist/*/build.json
