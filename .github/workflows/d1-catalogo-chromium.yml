name: D1.1 Chromium y HTML offline
on:
  push:
    branches: [refactor/d1-catalogo]
    paths: ['.github/workflows/d1-catalogo-chromium.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Playwright Chromium
        run: |
          npm install --no-save playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Validar HTML generado y pruebas de navegador
        shell: bash
        run: |
          set -euo pipefail
          npm run check:build
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/d1-http.log 2>&1 &
          trap 'kill $!' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/invierno_colonia_v9_9.html -o /dev/null && break; sleep 1; done
          export CHROMIUM_PATH="$(node --input-type=module -e "import {chromium} from 'playwright';console.log(chromium.executablePath())")"
          echo "SHA probado: $GITHUB_SHA"
          node scripts/check-d1-offline-browser.mjs
          node scripts/check-c16-focus-browser.mjs
          node scripts/check-c14-browser.mjs
      - name: Publicar evidencia, incluso ante fallos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d1-catalogo-chromium-${{ github.sha }}
          path: |
            /tmp/c16-focus/
            /tmp/c14-browser/
            /tmp/d1-http.log
          if-no-files-found: warn
